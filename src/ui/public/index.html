<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- Electron serves the packaged app with a strict Content-Security-Policy
         header (see src/electron/main.js); this meta tag documents intent for
         the browser dev server without breaking HMR (which needs ws:). -->
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="MeloAmp - a cross-platform desktop client for streaming your Melodee library."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>MeloAmp</title>
  </head>
  <body>
    <noscript>MeloAmp requires JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
